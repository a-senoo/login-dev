services:
  login-dev:
    build:
      context: .
      dockerfile: ./login-dev/infra/backend/Dockerfile
    volumes:
      - ./login-dev:/work/backend
    networks:
      - default
  mysql:
    image: 'mysql/mysql-server:8.0'
    environment:
      MYSQL_ROOT_PASSWORD: 'password'
      MYSQL_DATABASE: 'login_dev'
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: 'password'
    ports:
      - '13306:3306'
    networks:
      - default
    volumes:
      - ./login-dev/infra/mysql/my.cnf:/etc/mysql/conf.d/my.cnf